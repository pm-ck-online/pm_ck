# ==============================================================================
# CẤU HÌNH TRUNG TÂM — Phần mềm theo dõi & mô phỏng giao dịch CK Việt Nam (pm_ck)
# ==============================================================================
# LƯU Ý QUAN TRỌNG: Đây là phần mềm THEO DÕI VÀ MÔ PHỎNG.
# KHÔNG đặt lệnh giao dịch thật dưới bất kỳ hình thức nào.

app:
  name: "pm_ck"
  timezone: "Asia/Ho_Chi_Minh"
  log_level: "INFO"

# ------------------------------------------------------------------------------
# NGUỒN DỮ LIỆU (data_collector)
# ------------------------------------------------------------------------------
# adapter: tên adapter đang dùng (thiết kế dạng interface để dễ đổi nguồn)
# delayed_mode: mặc định BẬT (true) để tránh phát sinh chi phí dữ liệu real-time
#   ngay từ giai đoạn thử nghiệm. Nhiều nguồn công khai (SSI iBoard, VNDIRECT
#   DChart, TCBS, Fireant...) có khả năng bị tính phí theo quy định mới —
#   cần tự xác minh lại trước khi tắt chế độ này.
data_source:
  adapter: "vnstock"            # "mock" | "vnstock" | "ssi" | "vndirect" | ... (tự bổ sung sau)
  # Lấy lịch sử OHLCV bắt đầu từ ngày này (thay vì mặc định chỉ lấy ~800
  # phiên gần nhất ≈ 3,2 năm) — bổ sung 04/08/2026 để có đủ dữ liệu phân
  # tích thống kê dài hạn (VD các kiểm định trong core/entry_screener.py).
  # Để trống ("") hoặc xóa dòng này để quay lại lấy theo count như cũ.
  vnstock_start_date: "2021-01-01"
  delayed_mode: true
  warn_if_paid_source: true
  polling_interval_minutes: 5
  trading_hours:
    morning: ["09:00", "11:30"]
    afternoon: ["13:00", "15:00"]
  cache:
    enabled: true
    dir: "./data_cache"
  retry:
    max_attempts: 3
    backoff_seconds: 2
  stale_data_alert_minutes: 15   # cảnh báo nếu dữ liệu không cập nhật quá X phút

# ------------------------------------------------------------------------------
# DỮ LIỆU VĨ MÔ (ưu tiên cao nhất trong toàn hệ thống)
# ------------------------------------------------------------------------------
macro:
  sources:
    - "nhnn_fx_intervention"     # can thiệp tỷ giá NHNN
    - "omo_operations"           # bơm/hút tiền qua OMO
    - "interest_rates"           # lãi suất huy động/cho vay
    - "sector_policy_signals"    # định hướng chính sách theo ngành (vd. room tín dụng BĐS)
  refresh_hours: 24

# ------------------------------------------------------------------------------
# CHỈ BÁO KỸ THUẬT (indicators)
# ------------------------------------------------------------------------------
indicators:
  ma_short_period: 20        # MA20 - trung bình động đơn giản, ngắn hạn
  ema_mid_periods: [50, 100] # EMA50, EMA100 - trung hạn
  ema_long_period: 200       # EMA200 - dài hạn, đường chuẩn xác nhận giai đoạn thị trường
  volume_ma_periods: [15, 20]
  breakout_volume_multiplier: 1.5   # volume đột biến > 1.5-2 lần trung bình

# ------------------------------------------------------------------------------
# NHẬN DIỆN MÔ HÌNH THU HẸP BIÊN ĐỘ (pattern_detector)
# ------------------------------------------------------------------------------
pattern_detector:
  scan_months_min: 10
  scan_months_max: 30
  n_segments: 4

# ------------------------------------------------------------------------------
# XÁC ĐỊNH GIAI ĐOẠN THỊ TRƯỜNG (market_regime_detector)
# ------------------------------------------------------------------------------
market_regime:
  confirmation_lag_sessions: 3   # số phiên cần ổn định trước khi đổi phân loại giai đoạn

# ------------------------------------------------------------------------------
# PHÂN BỔ VỐN (capital_allocator) — chỉ khuyến nghị, không tự thực thi
# ------------------------------------------------------------------------------
capital_allocator:
  risk_per_trade_pct: 2.0      # rủi ro mỗi lệnh không quá 2% NAV mô phỏng
  risk_total_portfolio_pct: 20.0  # rủi ro toàn danh mục không quá 20% NAV mô phỏng
  allocation:
    uptrend:
      target_pct_range: [70, 100]
      tranches_pct: [30, 50, 20]
    downtrend:
      target_pct_range: [10, 30]
      tranches_pct: [100]
    sideway:
      target_pct_range: [30, 50]
      tranches_pct: [100]

# ------------------------------------------------------------------------------
# BACKTEST
# ------------------------------------------------------------------------------
backtest:
  fee_pct: 0.15   # phí môi giới + thuế bán tham khảo (0.1% - 0.35% tùy CTCK), cấu hình được
  walk_forward:
    enabled: true
    n_splits: 4

# ------------------------------------------------------------------------------
# DANH MỤC MÔ PHỎNG (paper_portfolio)
# ------------------------------------------------------------------------------
paper_portfolio:
  initial_cash: 100000000   # 100 triệu VND (ví dụ mặc định, người dùng tự đổi)
  rebalance_alert_threshold_pct: 10.0  # cảnh báo khi lệch tỷ trọng khuyến nghị > X%

# ------------------------------------------------------------------------------
# THÔNG BÁO (notifier) — Telegram
# ------------------------------------------------------------------------------
notifier:
  telegram:
    enabled: false
    bot_token_env: "TELEGRAM_BOT_TOKEN"   # đọc từ biến môi trường, KHÔNG hardcode
    whitelist_chat_ids: []                 # chỉ các chat_id trong danh sách này được gửi lệnh điều khiển

